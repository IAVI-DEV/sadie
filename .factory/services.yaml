commands:
  install: poetry install --with dev
  test: poetry run pytest tests/ -x --tb=short
  test_unit: poetry run pytest tests/unit/ -x --tb=short
  test_renumbering: poetry run pytest tests/unit/renumbering/test_renumbering.py -v
  test_macaque: poetry run pytest tests/unit/airr/test_macaque_e2e.py -v
  typecheck: poetry run pyright src/
  lint: pre-commit run --all-files
  format: poetry run black src/ tests/

services: {}
